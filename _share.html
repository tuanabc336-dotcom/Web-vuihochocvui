<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Baloo 2";
    font-style: normal;
    font-weight: 400 800;
    font-display: block;
    src: url("assets/fonts/baloo2-vietnamese.woff2") format("woff2");
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: "Baloo 2";
    font-style: normal;
    font-weight: 400 800;
    font-display: block;
    src: url("assets/fonts/baloo2-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Baloo 2", "Segoe UI", sans-serif;
    background: linear-gradient(150deg, #45d3b8 0%, #17b39d 42%, #0b9187 100%);
    color: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .glow {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
  }
  .g1 { width: 620px; height: 620px; top: -260px; right: -140px; }
  .g2 { width: 460px; height: 460px; bottom: -220px; left: -120px; }
  .cloud {
    position: absolute; background: rgba(255,255,255,.22); border-radius: 999px;
  }
  .c1 { width: 190px; height: 54px; top: 70px; left: 620px; }
  .c2 { width: 120px; height: 40px; top: 128px; left: 700px; }
  .c3 { width: 160px; height: 46px; bottom: 86px; right: 90px; opacity: .6; }

  .brand { display: flex; align-items: center; gap: 26px; position: relative; }
  .brand img { width: 118px; height: 118px; filter: drop-shadow(0 12px 20px rgba(4,60,54,.28)); }
  .word { font-size: 92px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .word span:nth-child(1) { color: #fff; }
  .word span:nth-child(2) { color: #ffe28a; }
  .word span:nth-child(3) { color: #ffd0bd; }

  .tag {
    position: relative;
    margin: 26px 0 0 8px;
    font-size: 40px;
    font-weight: 700;
    color: #eafff9;
  }
  .chips { display: flex; gap: 14px; margin: 40px 0 0 6px; position: relative; flex-wrap: wrap; max-width: 1010px; }
  .chip {
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
    border: 2px solid rgba(255,255,255,.5);
    font-size: 27px;
    font-weight: 700;
    color: #fff;
  }
  .foot {
    position: absolute;
    left: 104px;
    bottom: 52px;
    font-size: 25px;
    font-weight: 700;
    color: rgba(255,255,255,.85);
  }
</style>
</head>
<body>
  <i class="glow g1"></i>
  <i class="glow g2"></i>
  <i class="cloud c1"></i>
  <i class="cloud c2"></i>
  <i class="cloud c3"></i>

  <div class="brand">
    <img src="assets/img/logo-mark.svg" alt="">
    <div class="word"><span>Bé</span> <span>Vui</span> <span>Học</span></div>
  </div>
  <p class="tag">Học mà chơi, chơi mà học</p>
  <div class="chips">
    <span class="chip">Học chữ</span>
    <span class="chip">Ghép vần</span>
    <span class="chip">Tập viết</span>
    <span class="chip">Học số</span>
    <span class="chip">Tiếng Anh</span>
    <span class="chip">Trí nhớ</span>
  </div>
  <div class="foot">Miễn phí cho bé 3–6 tuổi · Không cần tài khoản</div>
</body>
</html>
